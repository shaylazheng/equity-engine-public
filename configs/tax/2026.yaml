# Federal tax parameters, tax year 2026.
#
# NOT tax advice. These are inputs to a backtest. Verify every figure against the
# IRS publication for the year before trusting a number that comes out of the
# engine, and let a CPA validate an actual return.
#
# Thresholds are UPPER BOUNDS of taxable income for each rate; the final band is
# open-ended (`null`). "Taxable income" means income after the standard or
# itemized deduction, and for long-term gains it *includes* the gains themselves,
# which is what makes them stack.

meta:
  tax_year: 2026
  checked_on: 2026-07-30
  sources:
    - https://taxfoundation.org/data/all/federal/2026-tax-brackets/
    - https://www.kiplinger.com/taxes/irs-updates-capital-gains-tax-thresholds
  note: >
    OBBBA (July 2025) made the larger standard deduction permanent. Entries
    marked `verified: false` were derived from the statutory relationship to the
    single-filer figures rather than read from a source, and must be confirmed
    before any married-filing-jointly result is reported.

# Net Investment Income Tax. Statutory and NOT inflation-indexed, so these do not
# move year to year.
niit:
  rate: 0.038
  magi_threshold:
    single: 200000
    mfj: 250000
    mfs: 125000
    hoh: 200000

# Net capital loss deductible against ordinary income per year; the remainder
# carries forward indefinitely, preserving its short/long character.
capital_loss:
  annual_ordinary_offset: 3000
  offset_mfs: 1500

filing_status:

  single:
    verified: true
    standard_deduction: 16100
    ordinary:
      - { upto: 12400,  rate: 0.10 }
      - { upto: 50400,  rate: 0.12 }
      - { upto: 105700, rate: 0.22 }
      - { upto: 201775, rate: 0.24 }
      - { upto: 256225, rate: 0.32 }
      - { upto: 640600, rate: 0.35 }
      - { upto: null,   rate: 0.37 }
    long_term:
      - { upto: 49450,  rate: 0.00 }
      - { upto: 545500, rate: 0.15 }
      - { upto: null,   rate: 0.20 }

  mfj:
    verified: false   # long_term thresholds derived, see meta.note
    standard_deduction: 32200
    ordinary:
      - { upto: 24800,  rate: 0.10 }
      - { upto: 100800, rate: 0.12 }
      - { upto: 211400, rate: 0.22 }
      - { upto: 403550, rate: 0.24 }
      - { upto: 512450, rate: 0.32 }
      - { upto: 768700, rate: 0.35 }
      - { upto: null,   rate: 0.37 }
    long_term:
      # The 0% band is exactly 2x the single figure by statute; the 15% ceiling
      # is approximate and is the reason this status is unverified.
      - { upto: 98900,  rate: 0.00 }
      - { upto: 613700, rate: 0.15 }
      - { upto: null,   rate: 0.20 }
