[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-backtest"
version = "0.1.0"
description = "Event-driven daily backtester with costs and tax lots"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "qe-core",
    "qe-tax",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qe_backtest"]

[tool.uv.sources]
qe-core = { workspace = true }
qe-tax = { workspace = true }
