[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-core"
version = "0.1.0"
description = "Identifiers, calendar, config, and the point-in-time contract"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "pandas-market-calendars>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qe_core"]
