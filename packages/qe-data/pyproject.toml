[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-data"
version = "0.1.0"
description = "Synthetic data transforms into the point-in-time panel"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "qe-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qe_data"]

[tool.uv.sources]
qe-core = { workspace = true }
