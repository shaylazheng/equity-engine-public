[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-report"
version = "0.1.0"
description = "HTML reports with constituent views and the flag board"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2",
    "qe-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qe_report"]

[tool.uv.sources]
qe-core = { workspace = true }
