[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-risk"
version = "0.1.0"
description = "Cross-sectional factor risk model and orthogonalization"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "qe-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qe_risk"]

[tool.uv.sources]
qe-core = { workspace = true }
