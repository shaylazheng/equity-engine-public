[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-signals"
version = "0.1.0"
description = "The signal library and its normalization framework"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "qe-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qe_signals"]

[tool.uv.sources]
qe-core = { workspace = true }
